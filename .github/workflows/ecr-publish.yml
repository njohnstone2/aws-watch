name: ECR

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ko builder
        uses: imjasonh/setup-ko@v0.10

      - name: Run tests
        run: make test

      - name: Build container locally
        run: make build

  publish:
    name: Publish to AWS Public ECR
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      KO_DOCKER_REPO: public.ecr.aws/njohnstone2
      KO_TAGS: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ko builder
        uses: imjasonh/setup-ko@<YOUR_CURRENT_SETUP_KO_VERSION>

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github_ecr
          role-session-name: github
          aws-region: us-east-1

      - name: Log into AWS Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push container image
        run: make publish